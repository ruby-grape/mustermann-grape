name: tests
on:
  [push, pull_request]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-22.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.6', '2.7', '3.0']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: '2.4.22'
          bundler-cache: true
      - name: Run tests
        run: bundle exec rspec